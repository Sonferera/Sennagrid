name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify documentation structure
        run: npm run check:docs

      - name: Enforce documentation updates on code changes (PR)
        if: github.event_name == 'pull_request'
        run: node scripts/check-docs.mjs --base "origin/${{ github.base_ref }}"

      - name: Run unit and integration tests
        run: npm run test

      - name: Typecheck and build web bundle
        run: npm run build
